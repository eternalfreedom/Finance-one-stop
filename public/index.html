<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0f11" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="One-Stop" />
  <title>Finance One-Stop</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div id="app">
    <aside class="rail" id="rail"></aside>
    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Menu"></button>
        <h1 id="pageTitle">Markets</h1>
        <div class="top-actions">
          <span class="live-dot" id="liveDot" title="Live connection"></span>
          <button class="icon-btn" id="searchBtn" aria-label="Search"></button>
          <a class="icon-btn star" href="#/watchlist" aria-label="Watchlist"></a>
        </div>
      </header>
      <div class="tape" id="tape"></div>
      <nav class="tabs" id="tabs"></nav>
      <main id="view" tabindex="-1"></main>
    </div>
    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
